# Luminexa — prod-local stack (ports 3000 / 9001)
# Env: .env.docker.prod only
name: luminexa

services:
  db:
    image: postgres:16-alpine
    container_name: luminexa-db
    env_file:
      - .env.docker.prod
    volumes:
      - luminexa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: luminexa-redis
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: luminexa-mailpit
    ports:
      # Localhost only — OTP/reset mail must not be exposed on the LAN/public interface.
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminexa-web
    ports:
      # Localhost only — browsers should use frontend :3000 (nginx → web).
      - "127.0.0.1:9001:9001"
    env_file:
      - .env.docker.prod
    environment:
      DJANGO_SETTINGS_MODULE: luminexa.settings
      RUN_DB_MIGRATE: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # PUBLIC_APP_URL comes from .env.docker.prod (must be your real site for Stripe returns)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - luminexa_media:/app/media
    healthcheck:
      # Entrypoint runs migrate before the server binds — celery waits on healthy.
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9001), 2); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminexa-celery-worker
    command: celery -A luminexa worker -l info
    env_file:
      - .env.docker.prod
    environment:
      DJANGO_SETTINGS_MODULE: luminexa.settings
      RUN_DB_MIGRATE: "0"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_healthy
    volumes:
      - luminexa_media:/app/media
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminexa-celery-beat
    command: celery -A luminexa beat -l info
    env_file:
      - .env.docker.prod
    environment:
      DJANGO_SETTINGS_MODULE: luminexa.settings
      RUN_DB_MIGRATE: "0"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
        REACT_APP_PUBLIC_URL: http://localhost:3000
    container_name: luminexa-frontend
    ports:
      - "0.0.0.0:3000:80"
      - "[::]:3000:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  luminexa_pg_data:
  luminexa_media:
