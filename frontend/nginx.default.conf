  # Prefer Cloudflare's visitor IP when present (tunnel / proxied traffic).
# Without this, $remote_addr is often the local cloudflared connector and
# country detection falls back to the app default (Canada).
map $http_cf_connecting_ip $lx_real_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Cloudflare (or other TLS terminator) sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $lx_forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind Cloudflare, $scheme is http. Absolute redirects would send users
  # to http://… which phones often show as a failed / 404 page.
  absolute_redirect off;
  port_in_redirect off;

  # Allow profile/service photo uploads (Django max is 3 MB per image).
  client_max_body_size 12m;

  # Baseline hardening (no HSTS / SSL redirects — TLS terminates elsewhere when used).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Re-resolve Docker service name when the web container restarts (avoids stale 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $django_upstream web:9001;

  # Shared proxy headers so Django sees the real visitor + CF country.
  # CF-IPCountry / CF-Connecting-IP are set by Cloudflare on live traffic.

  location /accounts/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  location /api/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # Django admin (must not SPA-fallback to index.html).
  location ^~ /admin/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # django-two-factor-auth login / TOTP setup (singular /account/, not /accounts/ API).
  location ^~ /account/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # Django admin CSS/JS (WhiteNoise on the API container).
  location ^~ /static/admin/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # two_factor / otp static assets from Django WhiteNoise.
  location ^~ /static/two_factor/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }
  location ^~ /static/otp_static/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # ^~ beats the extension regex below so /media/*.jpg is proxied to Django,
  # not treated as a missing frontend static asset (404).
  location ^~ /media/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # Never SPA-fallback hashed assets — missing JS must be 404, not index.html
  # (index.html as JS causes: Uncaught SyntaxError: Unexpected token '<').
  location ^~ /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Crawlable city SEO pages — never SPA-fallback to the JS shell.
  # Rewrite /ottawa/slug and /ottawa/slug/ to the real index.html file so a
  # trailing slash or empty ?query cannot 404.
  location = /ottawa {
    return 301 /ottawa/;
  }
  location ^~ /ottawa/ {
    rewrite ^/ottawa/([a-z0-9-]+)/?$ /ottawa/$1/index.html break;
    try_files $uri /ottawa/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location = /toronto {
    return 301 /toronto/;
  }
  location ^~ /toronto/ {
    rewrite ^/toronto/([a-z0-9-]+)/?$ /toronto/$1/index.html break;
    try_files $uri /toronto/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Digital Asset Links for TWA / Play — never SPA-fallback to index.html
  location ^~ /.well-known/ {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ^~ /icons/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location ^~ /screenshots/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
