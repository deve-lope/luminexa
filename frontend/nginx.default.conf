  # Prefer Cloudflare's visitor IP when present (tunnel / proxied traffic).
# Without this, $remote_addr is often the local cloudflared connector and
# country detection falls back to the app default (Canada).
map $http_cf_connecting_ip $lx_real_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Cloudflare (or other TLS terminator) sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $lx_forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

# Canonical host: strip www on the marketing domain only.
# app.luminex-a.com stays as-is (Search Console property).
map $host $lx_canonical_host {
  default                 $host;
  www.luminex-a.com       luminex-a.com;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind Cloudflare, $scheme is http. Absolute redirects would send crawlers
  # to http://… (duplicate URLs / "Page with redirect" in Search Console).
  absolute_redirect off;
  port_in_redirect off;

  # Allow profile/service photo uploads (Django max is 3 MB per image).
  client_max_body_size 12m;

  # Baseline hardening (HSTS is set at Cloudflare; origin only sees HTTP).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Re-resolve Docker service name when the web container restarts (avoids stale 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $django_upstream web:9001;

  # HTTPS + www canonicalisation. Local docker has no X-Forwarded-Proto, so
  # http://localhost:3000 is left alone.
  set $lx_redirect "";
  if ($http_x_forwarded_proto = "http") {
    set $lx_redirect "https://$lx_canonical_host$request_uri";
  }
  if ($host != $lx_canonical_host) {
    set $lx_redirect "https://$lx_canonical_host$request_uri";
  }
  if ($lx_redirect != "") {
    return 301 $lx_redirect;
  }

  location /accounts/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  location /api/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # ^~ beats the extension regex below so /media/*.jpg is proxied to Django,
  # not treated as a missing frontend static asset (404).
  location ^~ /media/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # Never SPA-fallback hashed assets — missing JS must be 404, not index.html
  # (index.html as JS causes: Uncaught SyntaxError: Unexpected token '<').
  location ^~ /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Static sitemap of indexable 200 URLs only — never proxy Django (avoids 5xx
  # when the API is down, and avoids listing gig URLs that 404/500).
  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Crawlable marketing HTML. Prefer trailing-slash canonicals:
  #  - /ottawa  → 301 /ottawa/
  #  - /ottawa/snow-removal → 301 /ottawa/snow-removal/
  # Nested paths must NOT fall back to the city hub (that served hub HTML
  # with the hub canonical — GSC "Alternate page with proper canonical tag").
  # Missing pages 404 instead of SPA-fallback (which redirected to /).
  location = /ottawa { return 301 /ottawa/; }
  location = /toronto { return 301 /toronto/; }
  location = /alternatives { return 301 /alternatives/; }
  location = /pricing { return 301 /pricing/; }
  location = /privacy { return 301 /privacy/; }

  location ^~ /ottawa/ {
    rewrite ^/ottawa/(.+)/index\.html$ /ottawa/$1/ permanent;
    rewrite ^/ottawa/index\.html$ /ottawa/ permanent;
    rewrite ^/ottawa/(.+[^/])$ /ottawa/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /toronto/ {
    rewrite ^/toronto/(.+)/index\.html$ /toronto/$1/ permanent;
    rewrite ^/toronto/index\.html$ /toronto/ permanent;
    rewrite ^/toronto/(.+[^/])$ /toronto/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /alternatives/ {
    rewrite ^/alternatives/(.+)/index\.html$ /alternatives/$1/ permanent;
    rewrite ^/alternatives/index\.html$ /alternatives/ permanent;
    rewrite ^/alternatives/(.+[^/])$ /alternatives/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /pricing/ {
    rewrite ^/pricing/index\.html$ /pricing/ permanent;
    rewrite ^/pricing/(.+[^/])$ /pricing/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /privacy/ {
    rewrite ^/privacy/index\.html$ /privacy/ permanent;
    rewrite ^/privacy/(.+[^/])$ /privacy/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
  }

  # SPA routes: do not use `$uri/` — that 301s any directory to a trailing slash
  # and was a source of GSC "Page with redirect" for public paths.
  location / {
    try_files $uri /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
