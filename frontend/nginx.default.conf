# Prefer Cloudflare's visitor IP when present (tunnel / proxied traffic).
# Without this, $remote_addr is often the local cloudflared connector and
# country detection falls back to the app default (Canada).
map $http_cf_connecting_ip $lx_real_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Cloudflare (or other TLS terminator) sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $lx_forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

# Host split (first matching regex wins):
#   www.*                    → luminex-a.com  (app paths below win first)
#   app + marketing/SEO path → luminex-a.com
#   apex + app/API path      → app.luminex-a.com
# Local docker (Host: localhost) does not match — SPA + marketing stay on one origin.
# Booking, dashboards, auth, API, /book/*, and store assets are not redirected
# off app.luminex-a.com.
#
# Cloudflare: point luminex-a.com, www, and app at this origin (already the case
# if all three return the same nginx). Do not add a CF bulk-redirect that sends
# every path to app — it would fight this map. Optional CF Redirect Rules can
# mirror these 301s at the edge, but origin nginx is the source of truth after
# this image is deployed.
map $host$uri $lx_force_host {
  default "";

  ~*^www\.luminex-a\.com/api/                 app.luminex-a.com;
  ~*^www\.luminex-a\.com/accounts/            app.luminex-a.com;
  ~*^www\.luminex-a\.com/media/               app.luminex-a.com;
  ~*^www\.luminex-a\.com/admin/               app.luminex-a.com;
  ~*^www\.luminex-a\.com/login(/|$)           app.luminex-a.com;
  ~*^www\.luminex-a\.com/register(/|$)        app.luminex-a.com;
  ~*^www\.luminex-a\.com/forgot-password(/|$) app.luminex-a.com;
  ~*^www\.luminex-a\.com/reset-password(/|$)  app.luminex-a.com;
  ~*^www\.luminex-a\.com/check-email(/|$)     app.luminex-a.com;
  ~*^www\.luminex-a\.com/verify-email(/|$)    app.luminex-a.com;
  ~*^www\.luminex-a\.com/accept-staff-invite(/|$) app.luminex-a.com;
  ~*^www\.luminex-a\.com/delete-account(/|$)  app.luminex-a.com;
  ~*^www\.luminex-a\.com/customer(/|$)        app.luminex-a.com;
  ~*^www\.luminex-a\.com/provider(/|$)        app.luminex-a.com;
  ~*^www\.luminex-a\.com/book(/|$)            app.luminex-a.com;
  ~*^www\.luminex-a\.com/services(/|$)        app.luminex-a.com;
  ~*^www\.luminex-a\.com                      luminex-a.com;

  ~*^app\.luminex-a\.com/$                    luminex-a.com;
  ~*^app\.luminex-a\.com/index\.html$         luminex-a.com;
  ~*^app\.luminex-a\.com/ottawa(/|$)          luminex-a.com;
  ~*^app\.luminex-a\.com/toronto(/|$)         luminex-a.com;
  ~*^app\.luminex-a\.com/alternatives(/|$)    luminex-a.com;
  ~*^app\.luminex-a\.com/pricing(/|$)         luminex-a.com;
  ~*^app\.luminex-a\.com/privacy(/|$)         luminex-a.com;
  ~*^app\.luminex-a\.com/sitemap\.xml$        luminex-a.com;
  ~*^app\.luminex-a\.com/robots\.txt$         luminex-a.com;
  ~*^app\.luminex-a\.com/llms\.txt$           luminex-a.com;

  ~*^luminex-a\.com/api/                      app.luminex-a.com;
  ~*^luminex-a\.com/accounts/                 app.luminex-a.com;
  ~*^luminex-a\.com/media/                    app.luminex-a.com;
  ~*^luminex-a\.com/admin/                    app.luminex-a.com;
  ~*^luminex-a\.com/login(/|$)                app.luminex-a.com;
  ~*^luminex-a\.com/register(/|$)             app.luminex-a.com;
  ~*^luminex-a\.com/forgot-password(/|$)      app.luminex-a.com;
  ~*^luminex-a\.com/reset-password(/|$)       app.luminex-a.com;
  ~*^luminex-a\.com/check-email(/|$)          app.luminex-a.com;
  ~*^luminex-a\.com/verify-email(/|$)         app.luminex-a.com;
  ~*^luminex-a\.com/accept-staff-invite(/|$)  app.luminex-a.com;
  ~*^luminex-a\.com/delete-account(/|$)       app.luminex-a.com;
  ~*^luminex-a\.com/customer(/|$)             app.luminex-a.com;
  ~*^luminex-a\.com/provider(/|$)             app.luminex-a.com;
  ~*^luminex-a\.com/book(/|$)                 app.luminex-a.com;
  ~*^luminex-a\.com/services(/|$)             app.luminex-a.com;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind Cloudflare, $scheme is http. Absolute redirects would send crawlers
  # to http://… (duplicate URLs / "Page with redirect" in Search Console).
  absolute_redirect off;
  port_in_redirect off;

  # Allow profile/service photo uploads (Django max is 3 MB per image).
  client_max_body_size 12m;

  # Baseline hardening (HSTS is set at Cloudflare; origin only sees HTTP).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Re-resolve Docker service name when the web container restarts (avoids stale 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $django_upstream web:9001;

  # HTTPS + host split. Local docker has no X-Forwarded-Proto, so
  # http://localhost:3000 is left alone.
  set $lx_target_host $host;
  if ($lx_force_host != "") {
    set $lx_target_host $lx_force_host;
  }
  set $lx_redirect "";
  if ($http_x_forwarded_proto = "http") {
    set $lx_redirect "https://$lx_target_host$request_uri";
  }
  if ($lx_force_host != "") {
    set $lx_redirect "https://$lx_force_host$request_uri";
  }
  if ($lx_redirect != "") {
    return 301 $lx_redirect;
  }

  location /accounts/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  location /api/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Proto $lx_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # ^~ beats the extension regex below so /media/*.jpg is proxied to Django,
  # not treated as a missing frontend static asset (404).
  location ^~ /media/ {
    proxy_pass http://$django_upstream;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $lx_real_ip;
    proxy_set_header X-Forwarded-For $lx_real_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # Never SPA-fallback hashed assets — missing JS must be 404, not HTML
  # (HTML as JS causes: Uncaught SyntaxError: Unexpected token '<').
  location ^~ /static/ {
    error_page 404 = @asset_404;
    try_files $uri @asset_404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /manifest.json {
    error_page 404 = @asset_404;
    try_files $uri @asset_404;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    error_page 404 = @asset_404;
    try_files $uri @asset_404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Static sitemap of indexable 200 URLs only — never proxy Django (avoids 5xx
  # when the API is down, and avoids listing gig URLs that 404/500).
  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /404.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex" always;
  }

  error_page 404 /404.html;

  # Crawlable marketing HTML. Prefer trailing-slash canonicals:
  #  - /ottawa  → 301 /ottawa/
  #  - /ottawa/snow-removal → 301 /ottawa/snow-removal/
  # Neighbourhood × service URLs 301 to the city × service page
  # (/ottawa/centretown/snow-removal/ → /ottawa/snow-removal/).
  # Nested paths must NOT fall back to the city hub (that served hub HTML
  # with the hub canonical — GSC "Alternate page with proper canonical tag").
  # Missing pages 404 instead of SPA-fallback (which redirected to /).
  location = /ottawa { return 301 /ottawa/; }
  location = /toronto { return 301 /toronto/; }
  location = /alternatives { return 301 /alternatives/; }
  location = /pricing { return 301 /pricing/; }
  location = /privacy { return 301 /privacy/; }

  location ^~ /ottawa/ {
    rewrite ^/ottawa/[^/]+/([^/]+)/$ /ottawa/$1/ permanent;
    rewrite ^/ottawa/[^/]+/([^/]+)$ /ottawa/$1/ permanent;
    rewrite ^/ottawa/(.+)/index\.html$ /ottawa/$1/ permanent;
    rewrite ^/ottawa/index\.html$ /ottawa/ permanent;
    rewrite ^/ottawa/(.+[^/])$ /ottawa/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /toronto/ {
    rewrite ^/toronto/[^/]+/([^/]+)/$ /toronto/$1/ permanent;
    rewrite ^/toronto/[^/]+/([^/]+)$ /toronto/$1/ permanent;
    rewrite ^/toronto/(.+)/index\.html$ /toronto/$1/ permanent;
    rewrite ^/toronto/index\.html$ /toronto/ permanent;
    rewrite ^/toronto/(.+[^/])$ /toronto/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /alternatives/ {
    rewrite ^/alternatives/(.+)/index\.html$ /alternatives/$1/ permanent;
    rewrite ^/alternatives/index\.html$ /alternatives/ permanent;
    rewrite ^/alternatives/(.+[^/])$ /alternatives/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /pricing/ {
    rewrite ^/pricing/index\.html$ /pricing/ permanent;
    rewrite ^/pricing/(.+[^/])$ /pricing/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ^~ /privacy/ {
    rewrite ^/privacy/index\.html$ /privacy/ permanent;
    rewrite ^/privacy/(.+[^/])$ /privacy/$1/ permanent;
    try_files $uri/index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    error_page 404 = @asset_404;
    try_files $uri @asset_404;
  }

  # SPA routes: do not use `$uri/` — that 301s any directory to a trailing slash
  # and was a source of GSC "Page with redirect" for public paths.
  location = /services { try_files /index.html =404; }
  location = /services/ { return 301 /services; }
  location = /login/ { return 301 /login; }
  location = /register/ { return 301 /register; }

  location ^~ /customer {
    try_files $uri /index.html;
  }
  location ^~ /provider {
    try_files $uri /index.html;
  }
  location ^~ /book {
    try_files $uri /index.html;
  }

  location ~ ^/(login|register|forgot-password|reset-password|check-email|verify-email|accept-staff-invite|delete-account)(/|$) {
    try_files $uri /index.html;
  }

  # Homepage SPA (marketing canonical is / on luminex-a.com).
  location = / {
    try_files /index.html =404;
  }

  # Unknown paths: real 404 (not the homepage SPA shell).
  location / {
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location @asset_404 {
    default_type text/plain;
    return 404 "Not found\n";
  }
}
