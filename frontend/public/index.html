    <script>
      // Mark Capacitor early (bridge may inject after first paint on remote URL).
      // Native app must not keep a service worker — it pins a stale SPA after deploys.
      (function () {
        function dropSw() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) { reg.unregister(); });
              });
            }
            if (window.caches) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) {}
        }
        function mark() {
          try {
            if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
              document.documentElement.classList.add('capacitor-native');
              dropSw();
              return true;
            }
          } catch (e) {}
          return false;
        }
        if (!mark()) {
          var n = 0;
          var t = setInterval(function () {
            if (mark() || ++n > 60) clearInterval(t);
          }, 50);
        }
      })();
    </script>
    <script>
      // Only clear workers on local dev hosts. Production registers /sw.js from index.js.
      (function () {
        var h = location.hostname;
        var local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
        if (!local) return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      })();
